name: daily-ads-analysis
version: "1.0.0"
type: scheduled
schedule: "Daily, 10:00 AM IST (after Seller Central data refreshes)"
trigger: "Active Campaigns exist in CRM (Status = Active, Type = Amazon PPC Test)"
project: Product Pipeline

skills_invoked:
  - skill: ads-ops-plan
    mode: TEST
    prefix: AO
    note: "daily_check sub-phase for in-progress D2.5 campaigns (Campaigns.Status = Active). Returns cumulative status, anomalies, and gate_2_readiness from halfway point."
  - skill: ads-ops-live
    mode: LIVE
    prefix: AO
    note: "health_check for post-Gate-2 Scale campaigns (Campaigns.Status = Scale). Returns CampaignHealthReport with bid magnitudes."
  - skill: product-monitor
    mode: MONITOR
    prefix: PM
  - skill: zoho-data-ops
    mode: WRITE
    prefix: ZO
  - skill: slack-messaging
    mode: auto
    prefix: SM

working_directories:
  context:
    path: "context/product-pipeline/"
    description: "Runtime business config — thresholds, CRM field mappings, campaign config"
  output:
    path: "context/pending-updates/"
    description: "Staged outputs for human review before git commit"

runtime_context:
  - "ppc-test-campaign-config.ctx.json"
  - "crm-field-mappings.ctx.json"
  - "amazon-ads-campaign-fields.ctx.json"

runtime_paths:
  dev: "skills/{capability}/{skill}/"
  deployed: "~/.claude/skills/{skill}/"
  plugin: "{plugin-name}:{skill-name}"

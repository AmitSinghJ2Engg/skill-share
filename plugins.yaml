# plugins.yaml -- Central plugin definitions
# Source of truth for all plugin builds. Read by generate-registry.py.
# Skills are organized by capability in skills/{capability}/{name}/
# Plugins pull skills from any capability group via include lists.

plugins:

  # ── Product Pipeline ──────────────────────────────────────────────

  product-discovery:
    description: "Domain 1 discovery stages -- keyword intelligence, product discovery, screening, market intelligence."
    version: "1.1.0"
    project: "Product Pipeline"
    skills:
      - skill: ikraft-keyword-intelligence
        from: research
      - skill: product-discover
        from: research
      - skill: product-screen
        from: research
      - skill: product-market-intelligence
        from: research

  product-evaluation:
    description: "Domains 1 + 1.5 -- deep evaluation, competitive positioning. Paired with margin-calculation (DL-023) and compliance-management (DL-024) plugins."
    version: "1.2.0"
    project: "Product Pipeline"
    skills:
      - skill: product-evaluate
        from: evaluation
      - skill: product-market-intelligence
        from: research

  product-sourcing:
    description: "Domain 2 -- product spec, vendor evaluation. Paired with margin-calculation (DL-023) and compliance-management (DL-024) plugins."
    version: "1.3.0"
    project: "Product Pipeline"
    skills:
      - skill: product-spec
        from: evaluation
      - skill: vendor-ops
        from: sourcing

  margin-calculation:
    description: "Unit economics authority -- per-unit profitability for Amazon India and Shopify, 5 modes (ESTIMATE, ACTUAL, COMPARISON, CHANNEL, BREAKEVEN). Split from product-evaluation + product-sourcing in DL-023 (size-driven: both host plugins were at 99% ceiling). Consumed by D1 (ESTIMATE), D2 (ACTUAL), D2.5 COMPARISON at Gate 2, and ad-hoc CHANNEL/BREAKEVEN utility calls."
    version: "1.0.0"
    project: "Product Pipeline"
    skills:
      - skill: margin-calculator
        from: finance

  compliance-management:
    description: "Product compliance authority -- India cert catalog (BIS, FSSAI, CDSCO, TEC, WPC, etc.), timeline check for Gate 2, certification lifecycle tracking. Split from product-evaluation + product-sourcing + product-testing + product-launch in DL-024 (size-driven: product-launch was at 88% ceiling). Live mode: TIMELINE_CHECK (Gate 2 consumer via test-campaign). Planned stubs: FEASIBILITY (Gate 1), INITIATION (mid-pipeline), COMPLETION (Gate 3) — design preserved in docs/skills/compliance-ops-planned-modes.md."
    version: "1.0.0"
    project: "Product Pipeline"
    skills:
      - skill: compliance-ops
        from: evaluation

  product-testing:
    description: "Domain 2.5 -- test campaign ops: monitoring, FBA dispatch, Slack messaging. Paired with ads-planning (DL-022) and compliance-management (DL-024) plugins."
    version: "1.5.0"
    project: "Product Pipeline"
    skills:
      - skill: fulfillment-ops
        from: operations
      - skill: product-monitor
        from: operations
      - skill: slack-messaging
        from: platform

  ads-planning:
    description: "Domain 2.5 -- Amazon PPC campaign planning, scenario generation, test analysis, anomaly detection. Split from product-testing in DL-022 (size-driven: ads-ops-plan was consuming 67% of product-testing budget)."
    version: "1.0.0"
    project: "Product Pipeline"
    skills:
      - skill: ads-ops-plan
        from: marketing

  # ── Launch & Ops ──────────────────────────────────────────────────

  product-launch:
    description: "Domain 3 -- listing copy, capital planning, bulk fulfillment. Paired with compliance-management plugin (DL-024) for Gate 3 compliance completion."
    version: "1.1.0"
    project: "Launch & Ops"
    skills:
      - skill: content-writer
        from: marketing
      - skill: capital-planner
        from: finance
      - skill: fulfillment-ops
        from: operations

  product-ops:
    description: "Domain 4 -- live monitoring, ad management, learning engine."
    version: "1.3.0"
    project: "Launch & Ops"
    skills:
      - skill: ism-learning-engine
        from: learning
      - skill: product-monitor
        from: operations
      - skill: ads-ops-live
        from: marketing
      - skill: slack-messaging
        from: platform

  # ── Standalone (heavyweight skills) ─────────────────────────────

  supplier-research:
    description: "Supplier intelligence engine -- multi-source discovery, enrichment, verification, classification, 5-dimension ranking for India suppliers."
    version: "1.0.0"
    project: "Product Pipeline"
    skills:
      - skill: supplier-intelligence
        from: research

  revenue-analytics:
    description: "Revenue health analytics -- sales, settlement reconciliation, returns, forecasting, P&L, marketing efficiency. Read-only."
    version: "1.0.0"
    project: "Launch & Ops"
    skills:
      - skill: revenue-ops
        from: finance
      - skill: slack-messaging
        from: platform

  # ── Platform (Shared I/O) ────────────────────────────────────────

  platform-io:
    description: "Platform I/O layer -- Zoho read/write/sync across CRM, Bigin, Books, Inventory, Desk, Analytics via MCP."
    version: "1.0.0"
    project: "Platform"
    skills:
      - skill: zoho-data-ops
        from: platform

  # ── Workflow (Orchestration Skills) ────────────────────────────────

  workflow-ops:
    description: "Workflow orchestration skills -- session-sized task workflows for market testing (test-launch-prep, campaign-plan, campaign-analysis, scale-decision), daily discovery, daily ads analysis. Invoked via /name with disable-model-invocation: true. Per DL-025: tasks are skills."
    version: "1.0.0"
    project: "Product Pipeline"
    skills:
      - skill: test-launch-prep
        from: workflow
      - skill: campaign-plan
        from: workflow
      - skill: campaign-analysis
        from: workflow
      - skill: scale-decision
        from: workflow
      - skill: daily-discovery
        from: workflow
      - skill: daily-ads-analysis
        from: workflow

  # ── System Ops (Governance) ───────────────────────────────────────

  governance-audit:
    description: "Skill standards compliance -- audit 20 standards (S1-S20), 46+ violation codes, maturity lifecycle, resolution registry."
    version: "1.0.0"
    project: "System Ops"
    skills:
      - skill: ikraft-skill-auditor
        from: governance

  governance-architecture:
    description: "Architecture compliance and ecosystem health -- 7-Law enforcement, pattern synthesis, gap detection and routing."
    version: "1.1.0"
    project: "System Ops"
    skills:
      - skill: ikraft-architecture-governance
        from: governance
      - skill: ism-gap-auditor
        from: governance
      - skill: slack-messaging
        from: platform

  governance-business:
    description: "Business decisions and performance measurement -- strategic alignment, GO FEARLESS quality, OKR/KPI governance."
    version: "1.0.0"
    project: "System Ops"
    skills:
      - skill: ism-business-authority
        from: governance
      - skill: okr-kpi-governance
        from: governance

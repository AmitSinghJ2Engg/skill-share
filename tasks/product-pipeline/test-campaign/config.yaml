name: test-campaign
version: "2.0.0"
type: event
trigger: "Product at FBA + SampleConfirmation exists in CRM"
project: Product Pipeline

skills_invoked:
  - skill: product-discover
    mode: LISTING_PARSE
    prefix: PD
    note: "Extract product data from Amazon listing URL for campaign planning"
  - skill: ikraft-keyword-intelligence
    mode: IMPORT
    prefix: KI
    note: "Import Helium10/Jungle Scout keyword CSV (optional)"
  - skill: fulfillment-ops
    mode: SAMPLE
    prefix: FO
  - skill: ads-ops-plan
    mode: SCENARIO
    prefix: AO
    note: "Generate campaign scenarios from ListingRecord + KeywordSet + budget"
  - skill: ads-ops-plan
    mode: TEST
    prefix: AO
  - skill: margin-calculator
    mode: COMPARISON
    prefix: MC
  - skill: product-monitor
    mode: MONITOR
    prefix: PM
  - skill: zoho-data-ops
    mode: WRITE
    prefix: ZO
  - skill: slack-messaging
    mode: auto
    prefix: SM

working_directories:
  context:
    path: "context/product-pipeline/"
    description: "Runtime business config — thresholds, CRM field mappings, gate criteria, zone rotation"
  output:
    path: "context/pending-updates/"
    description: "Staged outputs for human review before git commit"

runtime_context:
  - "ppc-test-campaign-config.ctx.json"
  - "gate-criteria.ctx.json"
  - "financial-constants.ctx.json"
  - "amazon-fee-table.ctx.md"
  - "amazon-ads-campaign-fields.ctx.json"
  - "crm-field-mappings.ctx.json"

runtime_paths:
  dev: "skills/{capability}/{skill}/"
  deployed: "~/.claude/skills/{skill}/"
  plugin: "{plugin-name}:{skill-name}"
